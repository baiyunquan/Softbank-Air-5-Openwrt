name: Build CKB01 USB initramfs

on:
  workflow_dispatch:
  push:
    branches: [main, ckb01-usb-bringup, ckb01-ath11k-bringup]
    paths:
      - '.github/workflows/build-ckb01.yml'
      - 'devices/common-bringup/**'
      - 'devices/oppo_ckb01/**'
      - 'patches/tree/ckb01/**'
      - 'scripts/ckb01-fit.py'
      - 'scripts/ckb01-bdf.py'
      - 'scripts/tests/test_ckb01_*.py'
      - 'tools/ath11k-bdencoder'
      - 'scripts/prepare-build.sh'
      - 'docs/CKB01_USB_BRINGUP.md'
      - 'docs/CKB01_WIFI_PORTING.md'

permissions:
  contents: read

concurrency:
  group: ckb01-usb-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: JuliusBairaktaris/openwrt-ppe-nss
  UPSTREAM_SHA: a0d3cabc052f9c3c19a0abe2b2633195f703bccc
  COMMON: common-bringup
  DEVICE: oppo_ckb01
  VARIANT: ckb01
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: Compile OPPO CKB01
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7
        with:
          path: builder
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk gettext git glibc-source \
            libncurses-dev libssl-dev python3 rsync swig unzip wget \
            zlib1g-dev zstd u-boot-tools device-tree-compiler cpio file bsdextrautils
          mkdir -p logs artifacts
          df -h .

      - name: Check OEM BDF, calibration helpers and FIT validation
        working-directory: builder
        run: |
          python3 scripts/ckb01-bdf.py --check
          python3 -m unittest discover -s scripts/tests -p 'test_ckb01_*.py' -v

      - name: Checkout pinned OpenWrt source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          fetch-depth: 1
          path: openwrt
          persist-credentials: false

      - name: Restore source downloads and compiler cache
        uses: actions/cache@v6
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: ckb01-${{ runner.os }}-${{ env.UPSTREAM_SHA }}-${{ github.run_id }}
          restore-keys: |
            ckb01-${{ runner.os }}-${{ env.UPSTREAM_SHA }}-

      - name: Prepare CKB01 patch, configuration and overlay
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
        run: |
          set -euo pipefail
          test "$(git -C openwrt rev-parse HEAD)" = "$UPSTREAM_SHA"
          bash builder/scripts/prepare-build.sh 2>&1 | tee logs/prepare.log
          python3 - <<'PY'
          from pathlib import Path
          lines = set(Path('openwrt/.config').read_text().splitlines())
          selected = sorted(line for line in lines if line.startswith('CONFIG_TARGET_qualcommax_ipq807x_DEVICE_') and line.endswith('=y'))
          assert selected == ['CONFIG_TARGET_qualcommax_ipq807x_DEVICE_oppo_ckb01=y'], selected
          assert 'CONFIG_TARGET_MULTI_PROFILE=y' not in lines
          assert 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' not in lines
          for symbol in ('TARGET_ROOTFS_INITRAMFS', 'TARGET_INITRAMFS_COMPRESSION_ZSTD',
                         'PACKAGE_kmod-mhi-pci-generic', 'PACKAGE_kmod-mhi-wwan-ctrl',
                         'PACKAGE_kmod-ath11k-ahb', 'PACKAGE_ath11k-firmware-ipq8074',
                         'PACKAGE_wpad-basic-mbedtls', 'PACKAGE_iw', 'PACKAGE_iwinfo',
                         'PACKAGE_wireless-regdb'):
              assert f'CONFIG_{symbol}=y' in lines, f'Missing {symbol}'
          for symbol in ('PACKAGE_kmod-nss-wifi-drv', 'ATH11K_NSS_WIFI'):
              assert f'CONFIG_{symbol}=y' not in lines, f'Unexpected {symbol}'
          PY
          {
            echo "Builder: $GITHUB_SHA"
            echo "Source: $UPSTREAM_REPO@$UPSTREAM_SHA"
            for feed in openwrt/feeds/*; do
              if [ -d "$feed/.git" ] || [ -f "$feed/.git" ]; then
                echo "Feed $(basename "$feed"): $(git -C "$feed" rev-parse HEAD)"
              fi
            done
          } > logs/source-versions.txt
          cp openwrt/.config logs/config.buildinfo
          {
            echo "SOURCE_DATE_EPOCH=$(git -C openwrt show -s --format=%ct HEAD)"
            echo 'TZ=UTC'
            echo 'LC_ALL=C'
            echo 'KBUILD_BUILD_USER=builder'
            echo 'KBUILD_BUILD_HOST=github'
          } >> "$GITHUB_ENV"

      - name: Download build sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if make download -j8 V=s 2>&1 | tee -a ../logs/download.log; then
              exit 0
            fi
            echo "Source download attempt $attempt failed" >&2
            sleep 5
          done
          exit 1

      - name: Compile CKB01 firmware
        id: compile
        working-directory: openwrt
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 4G
        run: |
          set -euo pipefail
          make -j"$(nproc)" 2>&1 | tee ../logs/build.log || \
            make -j1 V=s 2>&1 | tee -a ../logs/build.log

      - name: Verify and package USB initramfs
        run: |
          set -euo pipefail
          # Linux usr/initramfs_data.S embeds initramfs_inc_data regardless of
          # compression. The .cpio file is its input, not the embedded output.
          find openwrt/bin/targets/qualcommax/ipq807x openwrt/build_dir -type f \
            \( -name '*oppo_ckb01*' -o -path '*/usr/*initramfs*' \) \
            -printf '%p %s bytes\n' | sort | tee logs/build-artifact-inventory.txt
          mapfile -t fits < <(find openwrt/bin/targets/qualcommax/ipq807x -maxdepth 1 \
            -name 'openwrt-*-oppo_ckb01-initramfs-uImage.itb' -type f)
          mapfile -t ramdisks < <(find openwrt/build_dir -type f \
            -path '*/linux-*/usr/initramfs_inc_data')
          [[ ${#fits[@]} -eq 1 ]] || { echo 'Expected exactly one CKB01 initramfs FIT' >&2; exit 1; }
          [[ ${#ramdisks[@]} -eq 1 ]] || {
            echo "Expected exactly one kernel usr/initramfs_inc_data, found ${#ramdisks[@]}; see build-artifact-inventory.txt" >&2
            exit 1
          }
          sha256sum "${fits[0]}" "${ramdisks[0]}" | tee logs/verification-inputs.sha256
          python3 builder/scripts/ckb01-fit.py "${fits[0]}" \
            --initramfs "${ramdisks[0]}" --wireless --output artifacts | tee logs/fit-validation.log
          cp logs/source-versions.txt logs/config.buildinfo artifacts/
          cp builder/docs/CKB01_USB_BRINGUP.md artifacts/README.md
          cp builder/docs/CKB01_WIFI_PORTING.md artifacts/
          cp builder/devices/oppo_ckb01/firmware/provenance.json artifacts/bdf-provenance.json
          find openwrt/bin/targets/qualcommax/ipq807x -maxdepth 1 -type f \
            \( -name '*.manifest' -o -name '*.buildinfo' -o -name 'profiles.json' \) \
            -exec cp {} artifacts/ \;
          (cd artifacts && find . -maxdepth 1 -type f ! -name sha256sums -print0 \
            | sort -z | xargs -0 sha256sum) > logs/artifact-sha256sums
          cp logs/artifact-sha256sums artifacts/sha256sums
          {
            echo '## OPPO CKB01 USB bring-up image'
            echo "- Builder: \`$GITHUB_SHA\`"
            echo "- OpenWrt: \`$UPSTREAM_SHA\`"
            # shellcheck disable=SC2016
            echo '- USB filename: `uimage-initramfs.itb`'
            echo '- LAN1: DHCP WAN; LAN2: management at 192.168.5.1'
            echo '- APs: Air5-2G / Air5-5G; key Air5-OpenWrt; calibration read from unit ART'
            echo '- RAM root; hardware validation pending.'
            cat artifacts/fit-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CKB01 USB image and metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckb01-usb-initramfs-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckb01-build-logs-${{ github.sha }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Preserve raw build outputs on verification failure
        if: failure() && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckb01-unvalidated-build-${{ github.sha }}
          path: |
            openwrt/bin/targets/qualcommax/ipq807x/openwrt-*-oppo_ckb01-initramfs-uImage.itb
            openwrt/build_dir/**/usr/initramfs_inc_data
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
