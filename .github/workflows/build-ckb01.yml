name: Build CKB01 USB initramfs

on:
  workflow_dispatch:
  push:
    branches: [main, ckb01-usb-bringup, ckb01-ath11k-bringup, ckb01-usb-default-packaging]
    paths:
      - '.github/workflows/build-ckb01.yml'
      - 'devices/common-bringup/**'
      - 'devices/oppo_ckb01/**'
      - 'patches/tree/ckb01/**'
      - 'packages/**'
      - 'docs/CKB01_SDX55_PORTING.md'
      - 'docs/CKB01_OEM_MANAGEMENT.md'
      - 'scripts/ckb01-fit.py'
      - 'scripts/ckb01-usb-image.py'
      - 'scripts/ckb01-bdf.py'
      - 'scripts/ckb01-oem-bundle.py'
      - 'scripts/tests/test_ckb01_*.py'
      - 'tools/ath11k-bdencoder'
      - 'tools/ckb01-oem-recover/**'
      - 'scripts/prepare-build.sh'
      - 'docs/CKB01_USB_BRINGUP.md'
      - 'docs/CKB01_WIFI_PORTING.md'

permissions:
  contents: read

concurrency:
  group: ckb01-usb-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: JuliusBairaktaris/openwrt-ppe-nss
  UPSTREAM_SHA: a0d3cabc052f9c3c19a0abe2b2633195f703bccc
  COMMON: common-bringup
  DEVICE: oppo_ckb01
  VARIANT: ckb01
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: Compile OPPO CKB01
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7
        with:
          path: builder
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk gettext git glibc-source \
            libncurses-dev libssl-dev python3 rsync swig unzip wget \
            zlib1g-dev zstd u-boot-tools device-tree-compiler cpio file bsdextrautils \
            dosfstools mtools fdisk clang lld pkg-config libqmi-glib-dev libqrtr-glib-dev libjson-c-dev
          mkdir -p logs artifacts
          df -h .

      - name: Check OEM BDF, management runtime and FIT validation
        id: preflight
        continue-on-error: true
        working-directory: builder
        run: |
          set -uo pipefail
          python3 scripts/ckb01-bdf.py --check 2>&1 | tee ../logs/preflight-bdf.log
          bdf_status=${PIPESTATUS[0]}
          python3 scripts/ckb01-oem-bundle.py --check 2>&1 | tee ../logs/preflight-oem-runtime.log
          oem_status=${PIPESTATUS[0]}
          python3 -m unittest discover -s scripts/tests -p 'test_ckb01_*.py' -v 2>&1 | tee ../logs/preflight-tests.log
          tests_status=${PIPESTATUS[0]}
          if [[ $bdf_status -ne 0 || $oem_status -ne 0 || $tests_status -ne 0 ]]; then
            exit 1
          fi

      - name: Report preflight validation warning
        if: steps.preflight.outcome == 'failure'
        run: |
          echo '::warning title=CKB01 preflight validation::Preflight checks failed; continuing to compile and upload diagnostic artifacts.'
          echo '- Preflight checks reported errors; compilation continues and logs will be retained.' >> "$GITHUB_STEP_SUMMARY"

      - name: Build standalone OEM PDC recovery tools
        continue-on-error: true
        run: |
          if ! bash builder/tools/ckb01-oem-recover/build.sh artifacts 2>&1 | tee logs/recovery-build.log; then
            echo '::warning title=CKB01 OEM recovery::Standalone recovery tool build failed; firmware compile and uploads continue.'
          fi

      - name: Package OEM userspace management overlay
        continue-on-error: true
        run: |
          if ! python3 builder/scripts/ckb01-oem-bundle.py \
              --overlay artifacts/ckb01-oem-management-overlay.tar.gz 2>&1 | tee logs/oem-overlay-build.log; then
            echo '::warning title=CKB01 OEM overlay::Overlay packaging failed; firmware compilation and artifact uploads continue.'
          fi

      - name: Checkout pinned OpenWrt source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          fetch-depth: 1
          path: openwrt
          persist-credentials: false

      - name: Restore source downloads and compiler cache
        uses: actions/cache@v6
        with:
          path: openwrt/dl
          key: ckb01-${{ runner.os }}-${{ env.UPSTREAM_SHA }}-${{ github.run_id }}
          restore-keys: |
            ckb01-${{ runner.os }}-${{ env.UPSTREAM_SHA }}-

      - name: Prepare CKB01 patch, configuration and overlay
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
        run: |
          set -euo pipefail
          test "$(git -C openwrt rev-parse HEAD)" = "$UPSTREAM_SHA"
          bash builder/scripts/prepare-build.sh 2>&1 | tee logs/prepare.log
          if ! python3 - <<'PY'
          from pathlib import Path
          lines = set(Path('openwrt/.config').read_text().splitlines())
          selected = sorted(line for line in lines if line.startswith('CONFIG_TARGET_qualcommax_ipq807x_DEVICE_') and line.endswith('=y'))
          assert selected == ['CONFIG_TARGET_qualcommax_ipq807x_DEVICE_oppo_ckb01=y'], selected
          assert 'CONFIG_TARGET_MULTI_PROFILE=y' not in lines
          assert 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' not in lines
          assert 'CONFIG_CCACHE=y' in lines, 'OpenWrt compiler cache is not enabled'
          ccache_dir = next((line for line in lines if line.startswith('CONFIG_CCACHE_DIR=')), None)
          assert ccache_dir in (None, 'CONFIG_CCACHE_DIR=""'), ccache_dir
          for symbol in ('TARGET_ROOTFS_INITRAMFS', 'TARGET_INITRAMFS_COMPRESSION_ZSTD',
                         'PACKAGE_kmod-mhi-pci-generic', 'PACKAGE_kmod-mhi-wwan-ctrl',
                         'PACKAGE_kmod-ath11k-ahb', 'PACKAGE_ath11k-firmware-ipq8074',
                         'PACKAGE_wpad-basic-mbedtls', 'PACKAGE_iw', 'PACKAGE_iwinfo',
                         'PACKAGE_wireless-regdb', 'PACKAGE_ckb01-modem', 'PACKAGE_qmi-utils',
                         'PACKAGE_kmod-rmnet', 'PACKAGE_kmod-qrtr-mhi', 'PACKAGE_kmod-mhi-net',
                         'LIBQMI_WITH_QRTR_GLIB', 'LIBQMI_COLLECTION_FULL',
                         'PACKAGE_libffi'):
              assert f'CONFIG_{symbol}=y' in lines, f'Missing {symbol}'
          for symbol in ('PACKAGE_kmod-nss-wifi-drv', 'ATH11K_NSS_WIFI'):
              assert f'CONFIG_{symbol}=y' not in lines, f'Unexpected {symbol}'
          PY
          then
            echo '::warning title=CKB01 configuration validation::Configuration checks failed; compilation and uploads continue.'
          fi
          {
            echo "Builder: $GITHUB_SHA"
            echo "Source: $UPSTREAM_REPO@$UPSTREAM_SHA"
            for feed in openwrt/feeds/*; do
              if [ -d "$feed/.git" ] || [ -f "$feed/.git" ]; then
                echo "Feed $(basename "$feed"): $(git -C "$feed" rev-parse HEAD)"
              fi
            done
          } > logs/source-versions.txt
          cp openwrt/.config logs/config.buildinfo
          {
            echo "SOURCE_DATE_EPOCH=$(git -C openwrt show -s --format=%ct HEAD)"
            echo 'TZ=UTC'
            echo 'LC_ALL=C'
            echo 'KBUILD_BUILD_USER=builder'
            echo 'KBUILD_BUILD_HOST=github'
          } >> "$GITHUB_ENV"

      # Keep the compiler cache isolated to compatible CKB01 toolchains. The
      # source tree and .config identify OpenWrt's cross toolchain; runner GCC
      # and binutils versions cover the host compiler checks.
      - name: Compute CKB01 ccache key
        id: ccache_key
        run: |
          set -euo pipefail
          toolchain_tree="$(git -C openwrt rev-parse HEAD:toolchain)"
          fingerprint="$({
            printf '%s\n' "$toolchain_tree"
            grep -E '^CONFIG_(BINUTILS|GCC|LIBC|MUSL|GLIBC)_' openwrt/.config || true
            gcc --version
            as --version
          } | sha256sum | cut -c1-16)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore and configure CKB01 compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        env:
          # Match OpenWrt's default CONFIG_CCACHE_DIR ($TOPDIR/.ccache).
          CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
        with:
          key: ckb01-${{ runner.os }}-${{ steps.ccache_key.outputs.fingerprint }}
          restore-keys: |
            ckb01-${{ runner.os }}-${{ steps.ccache_key.outputs.fingerprint }}
          max-size: 4G
          install: binary
          append-timestamp: true
          job-summary: CKB01 CCache Statistics

      - name: Download build sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if make download -j8 V=s 2>&1 | tee -a ../logs/download.log; then
              exit 0
            fi
            echo "Source download attempt $attempt failed" >&2
            sleep 5
          done
          exit 1

      - name: Compile CKB01 firmware
        id: compile
        working-directory: openwrt
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 4G
        run: |
          set -euo pipefail
          make -j"$(nproc)" 2>&1 | tee ../logs/build.log || \
            make -j1 V=s 2>&1 | tee -a ../logs/build.log

      - name: Validate and package USB initramfs
        id: fit_package
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts logs
          # Linux usr/initramfs_data.S embeds initramfs_inc_data regardless of
          # compression. The .cpio file is its input, not the embedded output.
          find openwrt/bin/targets/qualcommax/ipq807x openwrt/build_dir -type f \
            \( -name '*oppo_ckb01*' -o -path '*/usr/*initramfs*' \) \
            -printf '%p %s bytes\n' | sort | tee logs/build-artifact-inventory.txt
          mapfile -t fits < <(find openwrt/bin/targets/qualcommax/ipq807x -maxdepth 1 \
            -name 'openwrt-*-oppo_ckb01-initramfs-uImage.itb' -type f | sort)
          mapfile -t ramdisks < <(find openwrt/build_dir -type f \
            -path '*/linux-*/usr/initramfs_inc_data' | sort)
          cp logs/source-versions.txt logs/config.buildinfo artifacts/
          cp builder/docs/CKB01_USB_BRINGUP.md artifacts/README.md
          cp builder/docs/CKB01_WIFI_PORTING.md artifacts/
          cp builder/docs/CKB01_SDX55_PORTING.md artifacts/
          cp builder/docs/CKB01_OEM_MANAGEMENT.md artifacts/
          cp builder/devices/oppo_ckb01/firmware/provenance.json artifacts/bdf-provenance.json
          cp builder/packages/ckb01-oem-tools/vendor/provenance.json artifacts/oem-runtime-provenance.json
          cp builder/packages/ckb01-oem-tools/payload/provenance.json artifacts/oem-adb-payload-provenance.json
          mkdir -p artifacts/oem-management-packages
          find openwrt/bin -type f \
            \( -name 'ckb01-oem-tools*.apk' -o -name 'ckb01-oem-tools*.ipk' \
               -o -name 'adb-*.apk' -o -name 'adb_*.ipk' \
               -o -name 'coreutils-timeout-*.apk' -o -name 'coreutils-timeout_*.ipk' \) \
            -exec cp {} artifacts/oem-management-packages/ \;
          find openwrt/bin/targets/qualcommax/ipq807x -maxdepth 1 -type f \
            \( -name '*.manifest' -o -name '*.buildinfo' -o -name 'profiles.json' \) \
            -exec cp {} artifacts/ \;
          if [[ ${#fits[@]} -eq 0 ]]; then
            echo '::warning title=CKB01 FIT missing::No compiled CKB01 FIT was found; metadata and logs will still be uploaded.'
            echo '- No compiled CKB01 FIT was found, so image packaging was skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ${#fits[@]} -ne 1 ]]; then
            echo "::warning title=CKB01 FIT count::Expected one CKB01 FIT, found ${#fits[@]}; preserving all raw FITs and using the first sorted file for packaging."
            mkdir -p artifacts/raw-build
            cp "${fits[@]}" artifacts/raw-build/
          fi
          # Keep the raw FIT uploadable if semantic validation fails. On
          # success the validator replaces it with the HK09-compatible FIT.
          cp "${fits[0]}" artifacts/uimage-initramfs.itb
          if [[ ${#ramdisks[@]} -ne 1 ]]; then
            echo "::warning title=CKB01 initramfs count::Expected one usr/initramfs_inc_data, found ${#ramdisks[@]}; preserving the raw FIT and continuing."
            printf 'The compiled FIT was not semantically validated because the build produced %s initramfs_inc_data files. The raw FIT is included as uimage-initramfs.itb.\n' "${#ramdisks[@]}" > artifacts/UNVALIDATED-FIT.txt
          else
            sha256sum "${fits[0]}" "${ramdisks[0]}" | tee logs/verification-inputs.sha256
            if python3 builder/scripts/ckb01-fit.py "${fits[0]}" \
              --initramfs "${ramdisks[0]}" --wireless --modem --output artifacts 2>&1 | tee logs/fit-validation.log; then
              echo 'FIT validation passed.'
            else
              validation_status=${PIPESTATUS[0]}
              echo "::warning title=CKB01 FIT validation::FIT checks failed (exit ${validation_status}); raw FIT retained and packaging will continue. See fit-validation.log."
              echo "- FIT validation failed with exit ${validation_status}; raw FIT retained and packaging continued. See uploaded build logs." >> "$GITHUB_STEP_SUMMARY"
              printf 'FIT validation failed with exit %s. This file accompanies the original compiled FIT, preserved as uimage-initramfs.itb. See fit-validation.log in the build logs.\n' "$validation_status" > artifacts/UNVALIDATED-FIT.txt
            fi
          fi
          (cd artifacts && find . -maxdepth 1 -type f ! -name sha256sums -print0 \
            | sort -z | xargs -0 sha256sum) > logs/artifact-sha256sums
          cp logs/artifact-sha256sums artifacts/sha256sums
          {
            echo '## OPPO CKB01 USB bring-up image'
            echo "- Builder: \`$GITHUB_SHA\`"
            echo "- OpenWrt: \`$UPSTREAM_SHA\`"
            # shellcheck disable=SC2016
            echo '- USB filename: `uimage-initramfs.itb`'
            echo '- LAN1: DHCP WAN; LAN2: management at 192.168.5.1'
            echo '- APs: Air5-2G / Air5-5G; key Air5-OpenWrt; calibration read from unit ART'
            echo '- SDX55 management: ckb01-oem exec/pull/push; ckb01-adb enable/shell/disable (on demand, no automatic EDL/reboot)'
            echo '- FIT includes RAM recovery; complete dual-partition IMG uses persistent AIR5ROOT when available. Hardware validation pending.'
            if [[ -f artifacts/fit-report.json ]]; then
              cat artifacts/fit-report.json
            else
              echo '- FIT validation report unavailable; raw build output is included.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report FIT packaging step warning
        if: steps.fit_package.outcome == 'failure'
        run: |
          echo '::warning title=CKB01 FIT packaging step::The verification/package step encountered an unexpected error; later upload steps will still preserve any available artifacts.'
          echo '- FIT packaging step had an unexpected error; raw build output upload is still enabled.' >> "$GITHUB_STEP_SUMMARY"

      - name: Build and verify complete USB disk image
        id: usb_package
        continue-on-error: true
        run: |
          set -uo pipefail
          if [[ ! -s artifacts/uimage-initramfs.itb ]]; then
            echo '::warning title=CKB01 USB image skipped::No FIT is available; build metadata and logs will still be uploaded.'
            exit 0
          fi
          rootfs_tar=$(find openwrt/bin/targets/qualcommax/ipq807x -name '*oppo_ckb01*-rootfs.tar.gz' -type f 2>/dev/null | head -n 1 || true)
          if [[ -z "$rootfs_tar" ]]; then
            # With PER_DEVICE_ROOTFS=n OpenWrt names this by target, not board.
            rootfs_tar=$(find openwrt/bin/targets/qualcommax/ipq807x -maxdepth 1 \
              -name 'openwrt-qualcommax-ipq807x-rootfs.tar.gz' -type f | head -n 1 || true)
          fi
          rootfs_opts=()
          if [[ -n "$rootfs_tar" && -s "$rootfs_tar" ]]; then
            echo "Found OpenWrt rootfs tarball: $rootfs_tar"
            cp "$rootfs_tar" artifacts/
            rootfs_opts=(--rootfs "$rootfs_tar")
          else
            echo '::warning title=CKB01 persistent root missing::No compiled rootfs tarball found; only RAM recovery IMG can be packaged. Raw FIT and logs remain uploadable.'
            echo '- Rootfs tarball missing: IMG has RAM recovery only, without persistent partition 2.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if python3 builder/scripts/ckb01-usb-image.py artifacts/uimage-initramfs.itb \
            "${rootfs_opts[@]}" --output artifacts 2>&1 | tee logs/usb-image-validation.log; then
            echo 'USB image validation passed.'
          else
            validation_status=${PIPESTATUS[0]}
            echo "::warning title=CKB01 USB image validation::USB image checks failed (exit ${validation_status}); available FIT and metadata will still be uploaded. See usb-image-validation.log."
            echo "- USB image validation failed with exit ${validation_status}; all available FIT and metadata artifacts will still be uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi
          (cd artifacts && find . -maxdepth 1 -type f ! -name sha256sums -print0 \
            | sort -z | xargs -0 sha256sum) > logs/artifact-sha256sums
          cp logs/artifact-sha256sums artifacts/sha256sums
          {
            echo '## Complete USB disk image'
            # shellcheck disable=SC2016
            echo '- Write `air5-ckb01-usb.img` (or decompressed `air5-ckb01-usb.img.gz`) to the whole USB drive, not a partition.'
            echo '- MBR partition table; bootable partition 1: 256 MiB FAT16 (`AIR5BOOT`) at LBA 2048.'
            if [[ ${#rootfs_opts[@]} -gt 0 ]]; then
              echo '- Partition 2: 1024 MiB ext4 (`AIR5ROOT`) persistent rootfs; auto-expands on first boot. Same-disk AIR5BOOT mounts read-only at /boot.'
            else
              echo '- No rootfs tarball available: single-partition RAM recovery image only.'
            fi
            echo '- Intended to boot through OEM USB autoboot; no interactive U-Boot command needed.'
            if [[ -f artifacts/usb-image-report.json ]]; then
              cat artifacts/usb-image-report.json
            else
              echo '- USB image report unavailable; available FIT and metadata are uploaded.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report USB packaging step warning
        if: steps.usb_package.outcome == 'failure'
        run: |
          echo '::warning title=CKB01 USB packaging step::The USB image step encountered an unexpected error; available ITB and metadata will still be uploaded.'
          echo '- USB packaging step had an unexpected error; available ITB and metadata upload is still enabled.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CKB01 USB image and metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckb01-usb-image-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckb01-build-logs-${{ github.sha }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Preserve raw build outputs
        if: always() && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckb01-unvalidated-build-${{ github.sha }}
          path: |
            openwrt/bin/targets/qualcommax/ipq807x/openwrt-*-oppo_ckb01-initramfs-uImage.itb
            openwrt/build_dir/**/usr/initramfs_inc_data
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
