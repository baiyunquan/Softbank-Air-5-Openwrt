name: Build CKB01 PCIe EDL maintenance
on:
  workflow_dispatch:
  push:
    branches: [ckb01-pcie-edl]
    paths:
      - '.github/workflows/**'
      - 'devices/**'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'docs/CKB01_MAINTENANCE.md'
permissions:
  contents: read
jobs:
  maintenance:
    uses: ./.github/workflows/build-ckb01.yml
    with:
      maintenance: true
