name: Package CKB01 default-boot USB

on:
  workflow_dispatch:
  push:
    branches: [ckb01-usb-default-packaging]
    paths:
      - '.github/workflows/package-ckb01-usb-default.yml'
      - 'scripts/ckb01-usb-default-image.py'
      - 'docs/CKB01_USB_DEFAULT_IMAGE.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: ckb01-default-package-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: baiyunquan/Softbank-Air-5-Openwrt
  SOURCE_RUN_ID: '38924263239'
  SOURCE_ARTIFACT_ID: '12061105888'
  SOURCE_ARTIFACT_NAME: ckb01-usb-initramfs-6e6cd66997956dd5ff10e66e2c01221a93f6106c
  SOURCE_ARTIFACT_DIGEST: sha256:6defc01ed32a320dc1e6d74cc4bdc3d95ee6968c97c9c79f98ffadc3b2005f3d
  SOURCE_COMMIT: 6e6cd66997956dd5ff10e66e2c01221a93f6106c
  SOURCE_FIT_SHA256: 7279e8676979c2d075eabef01d89bfe7940716d7b75cbf6ccd7b90334d701f49
  SOURCE_INITRAMFS_SHA256: 3b36bc2ec0997a42271f0c65e4714a2a05c86cb7642a701edd86c2239cf129d9
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  package:
    name: Repackage existing FIT only
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout packaging scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Confirm immutable successful source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p logs artifacts
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          repository = os.environ['SOURCE_REPOSITORY']
          base = f'https://api.github.com/repos/{repository}'
          def get(path):
              request = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'ckb01-default-packager',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = get('/actions/runs/' + os.environ['SOURCE_RUN_ID'])
          artifact = get('/actions/artifacts/' + os.environ['SOURCE_ARTIFACT_ID'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Source run did not succeed'
          assert run['head_sha'] == os.environ['SOURCE_COMMIT'], 'Source commit changed'
          assert artifact['name'] == os.environ['SOURCE_ARTIFACT_NAME'], 'Wrong source artifact'
          assert not artifact['expired'], 'Source artifact expired; no rebuild fallback is allowed'
          assert artifact['workflow_run']['id'] == run['id'], 'Artifact belongs to another run'
          assert artifact['digest'] == os.environ['SOURCE_ARTIFACT_DIGEST'], 'Source artifact digest changed'
          provenance = {
              'repository': repository,
              'source_run_id': run['id'],
              'source_run_url': run['html_url'],
              'source_run_conclusion': run['conclusion'],
              'source_commit': run['head_sha'],
              'artifact_id': artifact['id'],
              'artifact_name': artifact['name'],
              'artifact_digest': artifact['digest'],
              'fit_sha256': os.environ['SOURCE_FIT_SHA256'],
              'initramfs_sha256': os.environ['SOURCE_INITRAMFS_SHA256'],
              'packaging_commit': os.environ['GITHUB_SHA'],
              'packaging_run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          Path('logs/source-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          print(json.dumps(provenance, indent=2))
          PY

      - name: Download previously compiled firmware
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ env.SOURCE_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          repository: ${{ env.SOURCE_REPOSITORY }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          path: source-artifact
          digest-mismatch: error

      - name: Install image packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dosfstools mtools u-boot-tools device-tree-compiler zstd libzstd1

      - name: Verify existing FIT and create whole-device FAT16 IMG
        run: |
          set -euo pipefail
          python3 scripts/ckb01-usb-default-image.py source-artifact/uimage-initramfs.itb \
            --provenance logs/source-provenance.json --output artifacts \
            | tee logs/usb-image-validation.log
          cp docs/CKB01_USB_DEFAULT_IMAGE.md artifacts/README.md
          cp source-artifact/source-versions.txt source-artifact/config.buildinfo artifacts/
          cp source-artifact/bdf-provenance.json artifacts/
          (cd artifacts && find . -maxdepth 1 -type f ! -name sha256sums -print0 \
            | sort -z | xargs -0 sha256sum) > logs/artifact-sha256sums
          cp logs/artifact-sha256sums artifacts/sha256sums
          {
            echo '## CKB01 default-boot USB IMG v2'
            echo '- Reused firmware from source run 38924263239; firmware compilation was not performed.'
            echo '- 256 MiB whole-device FAT16, BPB at LBA 0, no MBR partition entries.'
            echo '- Root file: uImage-initramfs.itb; unchanged compiled FIT with SHA256 verified.'
            echo '- Matches the analyzed March 2021 bootipq_usb / usb 0:0 path.'
            echo '- Hardware boot remains unverified; initramfs RAM root has no persistence.'
            cat artifacts/usb-image-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload default-boot IMG and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckb01-usb-default-v2-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload packaging logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckb01-usb-default-v2-logs-${{ github.sha }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30
